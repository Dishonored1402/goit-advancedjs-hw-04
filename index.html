<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/goit-advancedjs-hw-04/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Search App</title>
    <script type="module" crossorigin src="/goit-advancedjs-hw-04/index.js"></script>
    <link rel="modulepreload" crossorigin href="/goit-advancedjs-hw-04/assets/vendor-BprjmLGJ.js">
    <link rel="stylesheet" crossorigin href="/goit-advancedjs-hw-04/assets/vendor-DkczhqSJ.css">
    <link rel="stylesheet" crossorigin href="/goit-advancedjs-hw-04/assets/index-CD_1XYsw.css">
  </head>
  <body>
    <header class="header">
  <div class="container">
    <nav class="nav">
      <a class="nav-logo" href="./index.html" aria-label="Site logo">
        <svg class="nav-logo-icon" width="100" height="30">
          <use href="/goit-advancedjs-hw-04/assets/sprite-E8vg0sBb.svg#logo"></use>
        </svg>
      </a>
    </nav>
  </div>
</header>


    <main>
      <section class="search-section">
        <div class="container">
          <form class="form search-form">
            <input
              class="search-input"
              type="text"
              name="query"
              autocomplete="off"
              placeholder="Search images..."
            />
            <button class="search-btn" type="submit">Search</button>
          </form>
        </div>
      </section>

      <section class="gallery-section">
        <div class="container">
          <ul class="gallery"></ul>

          <button class="load-more is-hidden" type="button">Load more</button>

          <span class="loader is-hidden">Loading images, please wait...</span>
          <p class="end-message is-hidden">
            We're sorry, but you've reached the end of search results.
          </p>
        </div>
      </section>
    </main>

  </body>
</html>
